[package]
name = "studio-hub"
version = "0.2.1"
edition = "2024"
description = "One desktop hub for the seven Craft apps, with a single MCP gateway for AI agents"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eframe = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
strip = true
