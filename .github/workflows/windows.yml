# Windows build of the suite: tests, studio-hub.exe, the installer and the portable zip, then an MCP
# smoke test of the installed layout (the same calls Claude Code and Codex make).
# Every run uploads the files as a workflow artifact; a pushed tag v* also attaches them to a release.
name: windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-pc-windows-msvc
            target/suite-win/downloads
          key: win-${{ hashFiles('Cargo.lock', 'packaging/windows/apps.txt') }}
          restore-keys: win-

      - name: Unit tests
        run: cargo test --release --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the suite
        shell: pwsh
        run: ./scripts/make-windows.ps1 -Arch x64

      - name: Install it (silent, per-user) and smoke-test the MCP gateway
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Studio Hub\studio-hub.exe"
          if (-not (Test-Path $exe)) { throw "installer did not put studio-hub.exe at $exe" }
          python scripts/smoke-mcp.py $exe --launch designcraft
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Suite-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*.zip
